# The dsh-treasury bundle patch: the ledger (ctx.treasury) plus its
# enforcement policy, layered over dsh-base.
#
# PREREQUISITE — the storage stack. dsh-base does not mount the non-session
# storage hub; the ledger's `inject: [storageDomain]` keeps both rows dormant
# until a domain form is mounted. The dsh-web-app bundle mounts the stack
# already (ids: storage, storage-json, storage-domain); on a profile WITHOUT
# it (e.g. plain dsh-base or headless), add the same three rows to your
# profile's cordis.patch.yml — a bundle must not insert another bundle's row
# ids, or a web profile would mount them twice:
#
#   - insert:
#       - id: storage
#         name: '@deepseek-ai/dsh-storage'
#       - id: storage-json
#         name: '@deepseek-ai/dsh-storage-json'
#         config:
#           root: !!js dshHomePath('storages')
#       - id: storage-domain
#         name: '@deepseek-ai/dsh-storage-domain'
#         config:
#           backend: json
#
# ENFORCEMENT ACTIVATION — disabled by default until a crypto-paying
# provider is configured. The ledger still meters Balances/expenses for
# accounting, but denies nothing while `enabled:false`. To enforce:
#   enabled: true
# Then fund it: await ctx.treasury.updateBalances([{ chain: 'ethereum',
#   token: 'USDC', amount: 250_000_000, usdEstimate: 250_000_000 }])
# `inferenceUsdPerMillionTokens` is your model's price (2000000 µUSD =
# $2.00/1M tokens) — keep 2000000 even while disabled so metering stays
# accurate once enabled.

- insert:
    - id: treasury
      name: 'dsh-treasury'
      config:
        burnWindowMs: 86400000
        fixedDailyBurnUsd: 0
        maxExpenses: 1000

    - id: treasury-policy
      name: 'dsh-treasury/policy'
      config:
        enabled: false
        inferenceUsdPerMillionTokens: 0
        defaultToolCostUsd: 0
        toolCosts: {}
        toolCategories: {}
        exemptTools: []
