name: docker-hub

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# NOTE: only actions/checkout is used — third-party marketplace actions
# (docker/*) do not resolve under this org's Actions policy, so the build
# uses the Docker CLI preinstalled on ubuntu-latest runners.
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DOCKERHUB: ${{ secrets.DOCKERHUB }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB:-}" ]; then
            echo "DOCKERHUB secret is empty" >&2
            exit 1
          fi
          if printf '%s' "$DOCKERHUB" | grep -q ':'; then
            user=${DOCKERHUB%%:*}
            pass=${DOCKERHUB#*:}
          else
            user=havencto
            pass=$DOCKERHUB
          fi
          echo "::add-mask::$pass"
          echo "$pass" | docker login -u "$user" --password-stdin
          echo "DOCKERHUB_USER=$user" >> "$GITHUB_ENV"

      - name: Build and push
        env:
          REPO: ${{ env.DOCKERHUB_USER }}/dsh-haven-web3-agent
        run: |
          set -euo pipefail
          args=( -f docker/Dockerfile )
          # Always tag the commit SHA.
          args+=( -t "$REPO:sha-${GITHUB_SHA::7}" )
          # :latest tracks the default branch.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            args+=( -t "$REPO:latest" )
          fi
          # v* tags ride along on tag pushes.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            args+=( -t "$REPO:$GITHUB_REF_NAME" )
          fi
          docker buildx build --push "${args[@]}" .
          # Verify the pushed digest resolves on the registry.
          docker buildx imagetools inspect "$REPO:sha-${GITHUB_SHA::7}"
