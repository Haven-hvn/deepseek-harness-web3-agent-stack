# The dsh-storage-synapse bundle patch: Synapse pinning behind wallet-signed
# authentication.
#
# This layer inserts ONLY its own row. The wallet seam row (`id: wallet`)
# belongs to the dsh-wallet bundle, and the signing provider row to
# dsh-wallet-ethereum — install all three:
#
#   dsh plugin --profile <name> add /path/to/dsh-wallet /path/to/dsh-wallet-ethereum /path/to/dsh-storage-synapse
#
# (Patch layers each insert their own rows; a row id inserted by two layers
# would mount the plugin twice, so a bundle never restates another bundle's
# rows.) Until the wallet seam is present this plugin stays dormant — its
# `inject: [wallet, tools]` waits for the services instead of failing.
#
# `wallet` names the dsh-wallet entry that signs every node request; there is
# deliberately no key or credential field in this configuration.

- insert:
    - id: storage-synapse
      name: 'dsh-storage-synapse'
      config:
        wallet: agent
        # Filecoin Onchain Cloud only — no Kubo, no localhost:5001.
        # OWS wallet-gated (filecoin-pin 1.3.0 AccountConfig): viem Account
        # delegates signTransaction/signMessage to ctx.wallet (OWS vault xmtp-agent)
        # + treasury authorize/recordExpense — no privateKeyRef, no raw key.
        rpcUrl: https://api.calibration.node.glif.io/rpc/v1
        networkMode: calibration
        withCDN: false
        # filecoin-pin#615 workaround: calibration 2-copy replication fails on flaky primaries 4,9
        copies: 1
        excludeProviderIds: [4, 9]
