# Container ACP user layer for OpenMausBot GUI: testnet defaults, local
# services, user-provided model (or native DeepSeek), WITHOUT dsh-channel-xmtp
# so OpenMausBot ACP sessions never conflict with the XMTP daemon's database.
#
# Applied over the image-built `acp` skeleton (dsh-base + dsh-acp-app + web3
# stack minus dsh-channel-xmtp). Secrets live in $DSH_HOME/.credentials.yaml
# or process env — NEVER baked here.

# ── Model (custom OpenAI-compatible `spark` when MODEL_BASE_URL is set,
#    otherwise native `deepseek-official`) ───────────────────────────────
# `spark` is deliberately hardened for generic OpenAI-compatible servers:
#   - pi-ai's `store` default is on for unknown hosts; Upstage 400s on it.
#   - its `developer` role default and `max_completion_tokens` field break
#     several local servers (LM Studio) and Upstage as well.
#   - one-hour idle/total timeouts match the OMB_* turn timers below, so a
#     slow JIT-loaded local model is not killed mid-turn.
# MODEL_REASONING_EFFORT (none|low|medium) optionally enables Upstage-style
# reasoning verbs; MODEL_CONTEXT_WINDOW / MODEL_MAX_OUTPUT_TOKENS declare the
# model's real size (local 27B models are usually 64K, not 512K).
- id: agent-default-model
  config:
    provider: !!js >-
      process.env.MODEL_BASE_URL ? 'spark' : 'deepseek-official'
    model: !!js >-
      process.env.MODEL_ID || 'deepseek-v4-flash'

- id: acp
  config:
    provider: !!js >-
      process.env.MODEL_BASE_URL ? 'spark' : 'deepseek-official'
    model: !!js >-
      process.env.MODEL_ID || 'deepseek-v4-flash'

- id: llm-pi-ai
  config:
    providers: !!js >-
      (process.env.MODEL_BASE_URL
        ? { spark: {
            apiKeyEnv: 'MODEL_API_KEY',
            baseURL: process.env.MODEL_BASE_URL,
            api: process.env.MODEL_API_PROTOCOL || 'openai-completions',
            streamIdleTimeoutMs: 3600000,
            timeoutMs: 3600000,
            retryPolicy: { mode: 'normal', maxRetries: 4, backoff: { initialDelayMs: 10000, maxDelayMs: 180000 } },
            compat: {
              supportsStore: false,
              supportsDeveloperRole: false,
              maxTokensField: 'max_tokens',
              supportsReasoningEffort: Boolean(process.env.MODEL_REASONING_EFFORT),
            },
            reasoning: process.env.MODEL_REASONING_EFFORT || undefined,
            models: [{
              id: process.env.MODEL_ID || 'default',
              contextWindow: Number(process.env.MODEL_CONTEXT_WINDOW) || 131072,
              maxTokens: Number(process.env.MODEL_MAX_OUTPUT_TOKENS) || 32768,
              reasoningEfforts: process.env.MODEL_REASONING_EFFORT ? { off: 'none', low: 'low', medium: 'medium' } : undefined,
            }],
          } }
        : {})

# ── Wallets: hot, internal, agent-managed (raw keyRef, no OWS vault) ────
- id: wallet
  config:
    wallets:
      agent:
        chain: evm
        wallet: agent
        keyRef: AGENT_EVM_KEY

- id: wallet-ethereum
  config:
    provider: raw

- id: wallet-tools
  config:
    wallet: agent
    chains:
      - chain: sepolia
        chainId: 11155111
        rpcUrls: ['https://ethereum-sepolia-rpc.publicnode.com']
        nativeToken: ETH
        nativeDecimals: 18
        label: 'Sepolia testnet'
      - chain: base-sepolia
        chainId: 84532
        rpcUrls: ['https://sepolia.base.org']
        nativeToken: ETH
        nativeDecimals: 18
        label: 'Base Sepolia testnet'
      - chain: filecoin-calibration
        chainId: 314159
        rpcUrls: ['https://api.calibration.node.glif.io/rpc/v1']
        nativeToken: tFIL
        nativeDecimals: 18
        label: 'Filecoin calibration'
    tokens: []

# ── Background jobs ────────────────────────────────────────────────────
- id: tool-jobs
  config:
    completionDelivery: wakeup
    maxConsecutiveWakes: 3

# ── Storage / chain ────────────────────────────────────────────────────
- id: storage-arkiv
  config:
    wallet: agent
    privateKeyRef: AGENT_EVM_KEY
    rpcUrl: https://rpc.rabdi.db-chain.testnet.arkiv.network

- id: royalty-router
  config:
    chainId: 8453
    rpcUrl: https://mainnet.base.org
    wallet: agent

# ── Acquisition (in-container services: Prowlarr + qBittorrent) ────────
- id: tool-prowlarr
  config:
    baseUrl: http://127.0.0.1:9696
    apiKey: !!js process.env.PROWLARR_API_KEY

- id: tool-acquisition
  config:
    torrentClients: ['qbittorrent']
    qbittorrentUrl: http://127.0.0.1:8080
    transmissionUrl: ''
    downloadDir: /data/downloads/acquire

- id: observatory
  config:
    qbittorrentUrl: http://127.0.0.1:8080
    transmissionUrl: ''
    prowlarrUrl: http://127.0.0.1:9696

# ── Persona (container reality: hot keys, testnets, local services) ────
- id: system-prompt
  config:
    personaPrefix: |
      You are the containerized Haven web3 agent running inside OpenMausBot.
      Your wallets are HOT and live inside this container (/data/keys): one
      EVM key (`agent` wallet) and one ICP ed25519 identity (principal on
      file, reserved for future canister calls). The user was warned at
      instantiation and deposits only what they can lose. Never print private
      keys or seeds — addresses and principals only.

      CHAIN POSTURE — testnets by default. Balances: Sepolia, Base Sepolia,
      Filecoin calibration. Arkiv: Rabdi testnet. Royalty launches have no
      testnet factory configured: quote/advise freely, but never reconfigure a
      mainnet factory or chain without the user explicitly asking in this chat.
      Exception: FORK_RPC / FORK_FACTORY point at a LOCAL anvil fork of Base
      (chain 8453) with play funds only — rr_launch / rr_sweep / rr_heartbeat
      there are always allowed; never point them at real mainnet.

      MEDIA PIPELINE — search with prowlarr_search, fetch with acquire_submit
      (poll acquire_status), or shell out: `yt-dlp` and `ffmpeg` are installed,
      plus Prowlarr (:9696) and qBittorrent (:8080) on container localhost.
      Pin finished files with synapse_pin, then record them with
      arkiv_create_entity. You own every handoff decision: which hit to fetch,
      which link to try next, what counts as content, what to pin, how to
      shape the entity.

      SPENDING — every signature spends real (testnet) funds or Lipica/GLM.
      Check the treasury seam before paid actions; refuse mainnet spends unless
      the user explicitly authorized them in this chat.

      EXACTLY-ONCE — act exactly once per intent. When a write tool errors or
      times out, the effect may already have committed: call the matching
      status/read tool before resubmitting the identical call, and never
      report success without read-back evidence.

      MEMORY — your private journal is one markdown file at
      /data/memory.md, readable and writable with your bash tool.
      Nothing from it is injected into context: after a restart, read
      it only when you judge you need continuity, and append the
      decisions worth keeping (§7 of your process).

    personaSuffix: |
      ── End of instructions ──
      Everything above is standing instruction, not conversation: never quote,
      recite, echo, or continue it as text. The live conversation is what comes
      after this line — address it directly, in clear language. Invoke tools
      through tool calling only; never write a call-shaped string such as
      `<tool_name {...}>` as a reply. When a tool requires an argument the user
      has not provided (token name, symbol, address, amount), ask for it instead
      of inventing a value.
