; Supervisor tree for the all-in-one Haven Web3 + OpenMausBot GUI container.
; Runs under `tini -s --` as PID 1 so Chromium/agent subprocesses are reaped.
; All worker processes run as `maus` (UID 1001) so downloaded files, dsh state,
; Observatory snapshots, and OpenMausBot workspaces share consistent ownership.
[unix_http_server]
file = /data/supervisor.sock
chmod = 0770
chown = root:maus

[supervisorctl]
serverurl = unix:///data/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon = true
logfile = /data/logs/supervisord.log
pidfile = /data/supervisord.pid
childlogdir = /data/logs

[program:prowlarr]
priority = 10
user = maus
command = /opt/prowlarr/Prowlarr/Prowlarr -data=/data/prowlarr
environment = HOME="/data/home"
autorestart = true
stdout_logfile = /data/logs/prowlarr.log
stderr_logfile = /data/logs/prowlarr.err.log

[program:qbittorrent]
priority = 10
user = maus
command = /usr/bin/qbittorrent-nox --webui-port=8080
environment = HOME="/data/home"
autorestart = true
stdout_logfile = /data/logs/qbittorrent.log
stderr_logfile = /data/logs/qbittorrent.err.log

[program:setup-indexers]
priority = 20
user = maus
command = node /opt/agent/setup-indexers.mjs
autorestart = false
startsecs = 0
stdout_logfile = /data/logs/setup-indexers.log
stderr_logfile = /data/logs/setup-indexers.err.log

[program:openmausbot]
priority = 30
user = maus
directory = /app
command = node /app/dist-server/server-launcher.js
environment = HOME="/data/openmausbot-home",OMB_DATA_DIR="/data/openmausbot",DSH_HOME="/data/dsh",DSH_TELEMETRY_DISABLED="1"
autorestart = true
stopsignal = TERM
stopwaitsecs = 20
stdout_logfile = /data/logs/openmausbot.log
stderr_logfile = /data/logs/openmausbot.err.log

[program:mausbot-pair]
priority = 40
user = maus
command = /opt/agent/mausbot-pair.sh
environment = HOME="/data/openmausbot-home",OMB_DATA_DIR="/data/openmausbot"
autorestart = false
startsecs = 0
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /data/logs/mausbot-pair.err.log

[program:dashboard]
priority = 50
user = maus
command = node /opt/stack/dsh-observatory/lib/serve.js
environment = OBSERVATORY_DIR="/data/observatory",DASHBOARD_HOST="0.0.0.0",DASHBOARD_PORT="8787"
autorestart = true
stdout_logfile = /data/logs/dashboard.log
stderr_logfile = /data/logs/dashboard.err.log
