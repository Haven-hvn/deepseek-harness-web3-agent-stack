; Supervisor tree for the all-in-one agent container. Priorities order
; startup; setup-indexers and convos-qr poll their dependency and run once
; (autorestart=false) — both are idempotent across container restarts.
[unix_http_server]
file = /data/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///data/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon = true
logfile = /data/logs/supervisord.log
pidfile = /data/supervisord.pid
childlogdir = /data/logs

[program:prowlarr]
priority = 10
command = /opt/prowlarr/Prowlarr/Prowlarr -data=/data/prowlarr
autorestart = true
stdout_logfile = /data/logs/prowlarr.log
stderr_logfile = /data/logs/prowlarr.err.log

[program:qbittorrent]
priority = 10
command = /usr/bin/qbittorrent-nox --webui-port=8080
environment = HOME="/data/home"
autorestart = true
stdout_logfile = /data/logs/qbittorrent.log
stderr_logfile = /data/logs/qbittorrent.err.log

[program:transmission]
priority = 10
command = /usr/bin/transmission-daemon -f --config-dir /data/transmission
environment = HOME="/data/home"
autorestart = true
stdout_logfile = /data/logs/transmission.log
stderr_logfile = /data/logs/transmission.err.log

[program:setup-indexers]
priority = 20
command = node /opt/agent/setup-indexers.mjs
autorestart = false
startsecs = 0
stdout_logfile = /data/logs/setup-indexers.log
stderr_logfile = /data/logs/setup-indexers.err.log

[program:agent]
priority = 30
command = dsh --profile agent
directory = /data
environment = DSH_HOME="/data/dsh",DSH_PERMISSION_MODE="danger-full-access",HOME="/data/home"
autorestart = true
stdout_logfile = /data/logs/agent.log
stderr_logfile = /data/logs/agent.err.log

[program:dashboard]
priority = 50
command = node /opt/stack/dsh-observatory/lib/serve.js
environment = OBSERVATORY_DIR="/data/observatory",DASHBOARD_HOST="0.0.0.0",DASHBOARD_PORT="8787"
autorestart = true
stdout_logfile = /data/logs/dashboard.log
stderr_logfile = /data/logs/dashboard.err.log

[program:convos-qr]
priority = 40
command = /opt/agent/convos-qr.sh
autorestart = false
startsecs = 0
stdout_logfile = /data/logs/convos-qr.log
stderr_logfile = /data/logs/convos-qr.err.log
